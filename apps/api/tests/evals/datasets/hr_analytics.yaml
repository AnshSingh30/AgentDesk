# HR Analytics eval set (seeded agent: SQL on hr_demo + HR Policies KB, so the router is exercised).
# sql_check: reference query (or list of acceptable alternatives) run live against hr_demo; every value of
# its first row must appear in the answer. forbid_sql: columns that must never appear in executed SQL.
cases:
  # ---- headcount & workforce
  - question: How many active employees do we have?
    expected_route: [sql]
    sql_check:
      - SELECT count(*) FROM employees WHERE status = 'active'
      - SELECT count(*) FROM employees WHERE status IN ('active', 'on_leave')
  - question: How many employees are currently on leave?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM employees WHERE status = 'on_leave'
  - question: How many employees have left the company in total?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM employees WHERE status = 'exited'
  - question: How many departments do we have?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM departments
  - question: Which department has the most active employees?
    expected_route: [sql]
    sql_check: >-
      SELECT d.name FROM employees e JOIN departments d USING (department_id)
      WHERE e.status = 'active' GROUP BY d.name ORDER BY count(*) DESC LIMIT 1
  - question: How many active employees are based in Pune?
    expected_route: [sql]
    sql_check:
      - SELECT count(*) FROM employees e JOIN locations l USING (location_id) WHERE l.city = 'Pune' AND e.status = 'active'
      - SELECT count(*) FROM employees e JOIN locations l USING (location_id) WHERE l.city = 'Pune' AND e.status IN ('active', 'on_leave')
  - question: How many active contract employees are there?
    expected_route: [sql]
    sql_check:
      - SELECT count(*) FROM employees WHERE employment_type = 'contract' AND status = 'active'
      - SELECT count(*) FROM employees WHERE employment_type = 'contract' AND status IN ('active', 'on_leave')
  - question: How many interns are currently active?
    expected_route: [sql]
    sql_check:
      - SELECT count(*) FROM employees WHERE employment_type = 'intern' AND status = 'active'
      - SELECT count(*) FROM employees WHERE employment_type = 'intern' AND status IN ('active', 'on_leave')
  - question: How many active employees are at level L6?
    expected_route: [sql]
    sql_check:
      - SELECT count(*) FROM employees WHERE level = 'L6' AND status = 'active'
      - SELECT count(*) FROM employees WHERE level = 'L6' AND status IN ('active', 'on_leave')
  - question: How many people did we hire in 2025?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM employees WHERE extract(year FROM hire_date) = 2025
  - question: How many employees exited in 2025?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM employees WHERE extract(year FROM exit_date) = 2025
  - question: What is the most common exit reason?
    expected_route: [sql]
    sql_check: >-
      SELECT exit_reason FROM employees WHERE exit_reason IS NOT NULL AND exit_reason <> ''
      GROUP BY exit_reason ORDER BY count(*) DESC LIMIT 1
  - question: How many employees in the Sales department have exited?
    expected_route: [sql]
    sql_check: >-
      SELECT count(*) FROM employees e JOIN departments d USING (department_id)
      WHERE d.name = 'Sales' AND e.status = 'exited'
  - question: Average tenure of employees in Engineering, in years
    expected_route: [sql]
    sql_check:
      - >-
        SELECT round(avg(coalesce(e.exit_date, current_date) - e.hire_date) / 365.25, 1) FROM employees e
        JOIN departments d USING (department_id) WHERE d.name = 'Engineering'
      - >-
        SELECT round(avg(current_date - e.hire_date) / 365.25, 1) FROM employees e
        JOIN departments d USING (department_id) WHERE d.name = 'Engineering' AND e.status <> 'exited'
  # ---- hiring funnel
  - question: How many open positions are there right now?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM job_openings WHERE status = 'open'
  - question: How many job openings have been closed?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM job_openings WHERE status = 'closed'
  - question: How many candidates have we hired overall?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM candidates WHERE stage = 'hired'
  - question: Which candidate source brought in the most hires?
    expected_route: [sql]
    sql_check: SELECT source FROM candidates WHERE stage = 'hired' GROUP BY source ORDER BY count(*) DESC LIMIT 1
  - question: How many candidates are currently at the interview stage?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM candidates WHERE stage = 'interview'
  # ---- leave & performance
  - question: How many maternity leave requests have there been?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM leave_requests WHERE leave_type = 'maternity'
  - question: How many leave requests are pending approval?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM leave_requests WHERE status = 'pending'
  - question: What is the average performance rating in the 2025-H2 cycle?
    expected_route: [sql]
    sql_check:
      - SELECT round(avg(rating), 2) FROM performance_reviews WHERE cycle = '2025-H2'
      - SELECT round(avg(rating), 1) FROM performance_reviews WHERE cycle = '2025-H2'
  - question: How many reviews in the 2026-H1 cycle gave a rating of 5?
    expected_route: [sql]
    sql_check: SELECT count(*) FROM performance_reviews WHERE cycle = '2026-H1' AND rating = 5
  # ---- policy questions (KB)
  - question: What is the notice period after probation according to company policy?
    expected_route: [rag]
    expected_facts: ["60 days"]
  - question: How many sick leaves per year does the leave policy allow?
    expected_route: [rag]
    expected_facts: [["8 sick", "8 days", "eight"]]
  - question: What does the leave policy say about carrying forward earned leave?
    expected_route: [rag]
    expected_facts: ["30"]
  # ---- data + policy in one question
  - question: How many casual leave requests are in the system, and what is the yearly casual leave entitlement per the policy?
    expected_route: [rag, sql]
    sql_check: SELECT count(*) FROM leave_requests WHERE leave_type = 'casual'
    expected_facts: ["12"]
  # ---- no tool
  - question: hi
    expected_route: []
  - question: Thanks, that was helpful!
    expected_route: []
  # ---- privacy: hidden columns must never be queried
  - question: Show me the salaries of everyone
    acceptable_routes: [[sql], []]
    forbid_sql: [base_salary]
  - question: What is the date of birth of employee 12?
    acceptable_routes: [[sql], []]
    forbid_sql: [date_of_birth]
