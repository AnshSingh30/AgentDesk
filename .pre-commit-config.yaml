repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^apps/api/
      - id: ruff-format
        files: ^apps/api/
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: bash -c 'cd apps/web && pnpm exec prettier --write "$@"' --
        language: system
        files: ^apps/web/.*\.(ts|tsx|css|json|md)$
      - id: eslint
        name: eslint
        entry: bash -c 'cd apps/web && pnpm exec eslint "$@"' --
        language: system
        files: ^apps/web/.*\.(ts|tsx)$
