name: Release
# Paused until a deployment platform is chosen: runs only when started manually from the Actions tab.
# To re-enable on version tags, restore:  push: { tags: ["v*"] }
on:
  workflow_dispatch:
permissions: { contents: write, packages: write }
jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [{ name: api, file: infra/docker/api.Dockerfile }, { name: worker, file: infra/docker/worker.Dockerfile }, { name: web, file: infra/docker/web.Dockerfile }]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.file }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/${{ matrix.image.name }}:${{ github.sha }}
          sbom: true
          provenance: true
  changelog:
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git log --pretty='- %s (%h)' $(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD > CHANGELOG_RELEASE.md
      - uses: softprops/action-gh-release@v3
        with: { body_path: CHANGELOG_RELEASE.md }
