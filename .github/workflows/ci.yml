name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: agentdesk, POSTGRES_PASSWORD: agentdesk, POSTGRES_DB: agentdesk }
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U agentdesk" --health-interval 5s --health-timeout 3s --health-retries 20
      hrdemo:
        image: postgres:16
        env: { POSTGRES_USER: hr_demo, POSTGRES_PASSWORD: hr_demo, POSTGRES_DB: hr_demo }
        ports: ["5434:5432"]
        options: --health-cmd "pg_isready -U hr_demo" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports: ["6333:6333"]
      minio:
        image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        env: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
        ports: ["9000:9000"]
        options: --health-cmd "mc ready local" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://agentdesk:agentdesk@localhost:5433/agentdesk
      HR_DEMO_DATABASE_URL: postgresql://hr_demo:hr_demo@localhost:5434/hr_demo
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: http://localhost:6333
      S3_ENDPOINT: http://localhost:9000
      ALLOW_PRIVATE_ENDPOINTS: "true"
      DEFAULT_CHAT_MODEL: fake/chat
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - run: uv python install 3.12 && uv sync --python 3.12
      - name: Lint & type-check
        run: uv run ruff check . && uv run ruff format --check . && uv run mypy
      - run: uv run alembic upgrade head
      - name: Unit + integration tests
        run: uv run pytest -q --cov=app --cov-report=term-missing --cov-fail-under=60
      - name: Security scans
        run: uvx bandit -q -r app -ll && uv export --no-hashes --format requirements-txt > /tmp/req.txt && (uvx pip-audit -r /tmp/req.txt --no-deps --disable-pip || true)
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: apps/web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm prettier --check .
      - run: pnpm build
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
      - run: pnpm audit --audit-level high || true
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker buildx build -f infra/docker/api.Dockerfile -t agentdesk-api:ci --load .
          docker buildx build -f infra/docker/web.Dockerfile -t agentdesk-web:ci --load .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: agentdesk-api:ci, severity: CRITICAL, exit-code: "1", ignore-unfixed: true }
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
